services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eduitsm
      POSTGRES_USER: eduitsm
      POSTGRES_PASSWORD: eduitsm_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduitsm -d eduitsm"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - eduitsm_postgres:/var/lib/postgresql/data

volumes:
  eduitsm_postgres:
