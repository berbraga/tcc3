name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eduitsm
          POSTGRES_USER: eduitsm
          POSTGRES_PASSWORD: eduitsm_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduitsm -d eduitsm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://eduitsm:eduitsm_dev@localhost:5432/eduitsm?schema=public
      TEST_DATABASE_URL: postgresql://eduitsm:eduitsm_dev@localhost:5432/eduitsm?schema=test
      JWT_SECRET: segredo-de-ci-com-mais-de-trinta-e-dois-caracteres
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
